<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha jornada · Barbearia Andrade</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="barbeiro-page">
<a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>
<svg style="display:none"><use href="icons/icons.svg#icon-scissors"/></svg>
<div class="shell barbeiro-shell">
  <aside class="sidebar" id="sidebar" aria-label="Menu do barbeiro">
    <div class="sidebar-brand">
      <div class="brand"><span>BARBEARIA</span><span>ANDRADE</span></div>
    </div>
    <nav class="nav sidebar-nav" aria-label="Seções do barbeiro">
      <button class="nav-item active" id="nav-agenda" type="button" data-tab-index="0" aria-current="page"><svg class="icon" aria-hidden="true"><use href="icons/icons.svg#icon-calendar"/></svg>Agenda de hoje</button>
      <button class="nav-item" id="nav-jornada" type="button" data-tab-index="1"><svg class="icon" aria-hidden="true"><use href="icons/icons.svg#icon-clock"/></svg>Minha jornada</button>
      <button class="nav-item" id="nav-servicos" type="button" data-tab-index="2"><svg class="icon" aria-hidden="true"><use href="icons/icons.svg#icon-scissors"/></svg>Meus serviços</button>
      <button class="nav-item" id="nav-comissoes" type="button" data-tab-index="3"><svg class="icon" aria-hidden="true"><use href="icons/icons.svg#icon-percent"/></svg>Comissões</button>
      <button class="nav-item" id="nav-clientes" type="button" data-tab-index="4"><svg class="icon" aria-hidden="true"><use href="icons/icons.svg#icon-user"/></svg>Clientes</button>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebar-user">
        <span class="avatar sidebar-user-avatar" id="sidebar-avatar" aria-hidden="true"></span>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name"></div>
          <div class="sidebar-user-role">Barbeiro</div>
        </div>
        <button class="btn btn-ghost btn-sm" id="sair" type="button">Sair</button>
      </div>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

  <main class="main" id="main-content" role="main">
    <header class="main-header">
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
        <svg class="icon icon-lg" aria-hidden="true"><use href="icons/icons.svg#icon-menu"/></svg>
      </button>
      <div class="main-title"><h1 class="display" id="titulo-pagina">Agenda de hoje</h1></div>
      <div style="width: 48px;"></div>
    </header>

    <section class="tabpanel" id="panel-agenda" role="tabpanel" aria-labelledby="nav-agenda">
      <div class="card">
        <div class="row">
          <div class="field">
            <label for="bb-data" class="field-label">Data</label>
            <input class="input" id="bb-data" type="date">
          </div>
          <div class="field">
            <label for="bb-status" class="field-label">Status</label>
            <select class="input" id="bb-status">
              <option value="">Todos os status</option>
              <option value="pendente">Pendentes</option>
              <option value="confirmado">Confirmados</option>
              <option value="cancelado">Cancelados</option>
              <option value="concluido">Concluídos</option>
            </select>
          </div>
        </div>
      </div>
      <div class="list" id="bb-agenda" aria-live="polite"></div>
    </section>

    <section class="tabpanel" id="panel-jornada" role="tabpanel" aria-labelledby="nav-jornada" hidden>
      <div class="card"><div class="dias" id="dias"></div></div>
    </section>

    <section class="tabpanel" id="panel-servicos" role="tabpanel" aria-labelledby="nav-servicos" hidden>
      <div class="card">
        <h2 class="display section-title">Serviços que atendo</h2>
        <div class="chips" id="servicos"></div>
        <p class="muted small" id="comissao"></p>
      </div>
    </section>

    <section class="tabpanel" id="panel-comissoes" role="tabpanel" aria-labelledby="nav-comissoes" hidden>
      <div class="card">
        <div class="field" style="flex: 1; min-width: 160px;">
          <label for="bc-status" class="field-label">Status</label>
          <select class="input" id="bc-status">
            <option value="">Todos os status</option>
            <option value="a_receber">A receber</option>
            <option value="pago">Pagas</option>
          </select>
        </div>
        <div class="field" style="flex: 1; min-width: 160px;">
          <label for="bc-data-inicio" class="field-label">Data início</label>
          <input class="input" id="bc-data-inicio" type="date" placeholder="Data início">
        </div>
        <div class="field" style="flex: 1; min-width: 160px;">
          <label for="bc-data-fim" class="field-label">Data fim</label>
          <input class="input" id="bc-data-fim" type="date" placeholder="Data fim">
        </div>
      </div>
      <div class="tabela" id="bc-tabela"></div>
      <div class="tabela" id="bc-resumo" style="margin-top: 16px;"></div>
    </section>

    <section class="tabpanel" id="panel-clientes" role="tabpanel" aria-labelledby="nav-clientes" hidden>
      <div class="card">
        <div class="field" style="flex: 1; min-width: 200px;">
          <label for="bcl-busca" class="field-label sr-only">Buscar cliente</label>
          <input class="input" id="bcl-busca" type="text" placeholder="Buscar cliente...">
        </div>
      </div>
      <div class="list" id="bcl-lista"></div>
    </section>
  </main>
</div>
<script src="js/app.js"></script>
<script src="js/barbeiro.js"></script>
</body>
</html>
